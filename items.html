<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Items - CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

    <nav class="navbar">

        <div class="logo">
            Campus<span>Find</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>
            <a href="items.html">Browse Items</a>
            <a href="about.html">About</a>

        </div>

    </nav>

</header>


<section class="items-section">

    <h1>Lost & Found Items</h1>

    <p>
        Search for items reported by students.
    </p>


    <!-- Search -->

    <div class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="Search item..."
        >


        <select id="filterCategory">

            <option value="All">
                All Categories
            </option>

            <option value="ID Card">
                ID Card
            </option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Books">
                Books
            </option>

            <option value="Bags">
                Bags
            </option>

            <option value="Accessories">
                Accessories
            </option>

            <option value="Keys">
                Keys
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <select id="filterType">

            <option value="All">
                Lost & Found
            </option>

            <option value="Lost">
                Lost
            </option>

            <option value="Found">
                Found
            </option>

        </select>

    </div>


    <!-- Items -->

    <div id="itemsContainer" class="items-container">

    </div>


</section>


<footer>

    <p>
        © 2026 CampusFind | College Lost & Found Portal
    </p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
