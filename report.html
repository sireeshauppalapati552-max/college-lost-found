<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Item - CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

    <nav class="navbar">

        <div class="logo">
            Campus<span>Find</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>
            <a href="items.html">Browse Items</a>
            <a href="about.html">About</a>

        </div>

    </nav>

</header>


<section class="form-section">

    <div class="form-container">

        <h1>Report an Item</h1>

        <p class="form-description">
            Enter the details of the lost or found item.
        </p>


        <form id="itemForm">


            <!-- Lost / Found -->

            <label for="type">
                Item Status
            </label>

            <select id="type" required>

                <option value="">
                    Select status
                </option>

                <option value="Lost">
                    Lost
                </option>

                <option value="Found">
                    Found
                </option>

            </select>


            <!-- Item Name -->

            <label for="itemName">
                Item Name
            </label>

            <input
                type="text"
                id="itemName"
                placeholder="Example: Black Wallet"
                required
            >


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select category
                </option>

                <option value="ID Card">ID Card</option>
                <option value="Electronics">Electronics</option>
                <option value="Books">Books</option>
                <option value="Bags">Bags</option>
                <option value="Accessories">Accessories</option>
                <option value="Keys">Keys</option>
                <option value="Other">Other</option>

            </select>


            <!-- Location -->

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: College Library"
                required
            >


            <!-- Date -->

            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            >


            <!-- Description -->

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe the item..."
                required
            ></textarea>


            <!-- Contact -->

            <label for="contact">
                Contact Information
            </label>

            <input
                type="text"
                id="contact"
                placeholder="Email or phone number"
                required
            >


            <button type="submit" class="btn submit-btn">
                Submit Report
            </button>


        </form>

    </div>

</section>


<footer>

    <p>
        © 2026 CampusFind | College Lost & Found Portal
    </p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
